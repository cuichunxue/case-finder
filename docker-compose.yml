services:
  case-finder:
    build: .
    ports:
      - "5000:5000"
    environment:
      # 事例DBとアップロード先（./store に永続化）
      - CASE_FINDER_DB=/store/cases.db
      - CASE_FINDER_DATA_DIR=/store/data
      # --- 任意設定（コメント解除して使う）---
      # - CASE_FINDER_PASSWORD=ひみつ            # 全体にBasic認証
      # - CASE_FINDER_WRITE_PASSWORD=ひみつ      # 取り込み/AIのみ認証
      # - CASE_FINDER_RERANKER=hotchpotch/japanese-reranker-cross-encoder-large-v1
      # - CASE_FINDER_AZURE=on                   # Azure要約を使う
      # - AZURE_OPENAI_ENDPOINT=https://<resource>.openai.azure.com
      # - AZURE_OPENAI_API_KEY=<key>
      # - AZURE_OPENAI_CHAT_DEPLOYMENT=<chatデプロイ名>
    volumes:
      - ./store:/store                 # 事例ファイル(./store/data)とDB(./store/cases.db)
      - hf-cache:/root/.cache          # HuggingFace等のモデルキャッシュ
      - easyocr-cache:/root/.EasyOCR   # EasyOCR モデルキャッシュ
    restart: unless-stopped

volumes:
  hf-cache:
  easyocr-cache:
